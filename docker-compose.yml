services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-scoutroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-website_scout}
      MYSQL_USER: ${MYSQL_USER:-scout}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scout}
    volumes:
      - scout_mysql:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-scoutroot}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3080}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_DRIVER: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-scout}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scout}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-website_scout}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      APP_URL: ${APP_URL:-http://187.77.16.73:3080}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_WORKSPACE: ${BOOTSTRAP_WORKSPACE:-Primary}

volumes:
  scout_mysql:
