name: Release regression gate
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build locked test image
        run: docker build --no-cache --platform linux/amd64 --target test -t bitpype-ci:test .
      - name: Database, browser, isolation, OCR and dependency gates
        run: bash deploy/verify-release.sh bitpype-ci:test evidence
      - name: Compare a second clean build
        run: |
          docker build --no-cache --platform linux/amd64 --target test -t bitpype-ci:repeat .
          docker run --rm --network none -v "$PWD/deploy/build-fingerprint.cjs:/fingerprint.cjs:ro" --entrypoint node bitpype-ci:test /fingerprint.cjs > evidence/fingerprint-first.json
          docker run --rm --network none -v "$PWD/deploy/build-fingerprint.cjs:/fingerprint.cjs:ro" --entrypoint node bitpype-ci:repeat /fingerprint.cjs > evidence/fingerprint-repeat.json
          node deploy/compare-builds.cjs evidence/fingerprint-first.json evidence/fingerprint-repeat.json > evidence/rebuild-comparison.json
      - name: Preserve evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-regression-evidence
          path: evidence/
          retention-days: 14
