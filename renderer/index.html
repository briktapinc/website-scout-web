<!DOCTYPE html>

<head>

  <title>Website Scout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">

        <a href="#/dashboard" data-route="dashboard">

    </div>
  </div>
  <script src="app.js"></script>

</html>
