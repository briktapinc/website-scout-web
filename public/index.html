<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="auth-gate" class="auth-gate hidden"></div>
  <div id="app-shell" class="shell hidden">
    <header class="topbar">
      <div class="brand">Website Scout</div>
      <nav class="nav-links" aria-label="Primary">
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/leads" data-route="leads">Leads</a>
        <a href="#/design" data-route="design">Design</a>
        <a href="#/jobs" data-route="jobs">Jobs</a>
        <a href="#/mcp" data-route="mcp">MCP</a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>
      <div class="topbar-meta">
        <select id="workspace-select" aria-label="Workspace"></select>
        <span id="shell-automation" class="pill">Automation</span>
        <button type="button" id="logout-btn" class="btn ghost">Log out</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
